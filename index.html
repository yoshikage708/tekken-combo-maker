<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鉄拳コンボメーカー</title>
  <meta name="description" content="鉄拳8のコンボを見やすいカードにする初心者向けツール">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extra.css"><link rel="stylesheet" href="notation.css"><link rel="stylesheet" href="input-modes.css"><link rel="stylesheet" href="stage.css"><link rel="stylesheet" href="compact-icons.css">
</head>
<body>
<main class="app">
  <header><p class="eyebrow">TEKKEN 8</p><h1>COMBO MAKER</h1><p>押した順に、伝わるコンボカードへ。</p></header>
  <section class="live sticky"><div><small>入力確認</small><div id="live" class="combo"></div><p id="status">コマンドを入力してください</p></div><button id="undo">↶ 1つ戻す</button></section>
  <section class="panel"><button id="toggle" class="toggle" aria-expanded="true"><span>コマンド入力</span><span id="chevron">▲</span></button><div id="controls" class="controls"></div></section>
  <section class="fields">
    <label>キャラクター名<input id="character" value="Leroy" maxlength="30"></label>
    <label>DAMAGE<input id="damage" type="number" value="72" min="0" max="999"></label>
    <label>難易度<select id="difficulty"><option>★☆☆☆☆</option><option selected>★★☆☆☆</option><option>★★★☆☆</option><option>★★★★☆</option><option>★★★★★</option></select></label>
    <label class="wide">POINT・注釈<textarea id="notes" rows="3" maxlength="500" placeholder="例：トルネード後は少し前ステ"></textarea></label>
  </section>
  <section><div class="section-title"><h2>完成カード</h2><div class="actions"><button id="clear" class="quiet">全消去</button><button id="save" class="save">↓ PNG保存</button></div></div><article class="card"><div class="card-head"><div><strong id="cardCharacter">Leroy</strong><small>COMBO GUIDE</small></div><div class="damage"><small>DAMAGE</small><strong id="cardDamage">72</strong></div></div><div id="cardCombo" class="combo card-combo" role="button" tabindex="0" aria-label="コンボ。ダブルタップで直前の入力を削除"></div><div class="card-foot"><div><small>難易度</small><strong id="cardDifficulty">★★☆☆☆</strong></div><div><small>POINT</small><p id="cardNotes">注釈を入力するとここに表示されます。</p></div></div></article><p class="hint">完成カードのコンボ部分をダブルタップしても、直前の入力を消せます。</p></section>
  <footer><p>非公式ファンメイドツールです。鉄拳およびTEKKENは各権利者に帰属します。</p></footer>
</main><script src="app.js"></script>
</body></html>
